# Plain Kubernetes manifests — no Helm, no cluster-specific add-on, so
# this applies unchanged on k3s, kind, EKS/GKE/AKS or anything else that
# speaks the core API.
#
# Replace the image below with the tag published by
# .github/workflows/publish-image.yml before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pasapalabra
  labels:
    app.kubernetes.io/name: pasapalabra
spec:
  # Game state lives in the process, so a second replica would serve
  # half the requests from an empty match list. Scaling out needs shared
  # state first — see docs/known-limitations.md.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pasapalabra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pasapalabra
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/OWNER/pasapalabra:REPLACE_ME
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
