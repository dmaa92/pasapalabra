# Local development stack: one service, no database — game state lives in
# the process (docs/known-limitations.md). The same image is what gets
# deployed to any container platform (deploy/k8s/).
services:
  app:
    build:
      context: .
      target: runtime
    image: pasapalabra:dev
    # Loopback-only by default: nothing here is meant to be reachable
    # from the LAN without a deliberate decision.
    ports:
      #- "127.0.0.1:${APP_PORT:-1080}:8080"
      - "9080:8080"
    environment:
      UVICORN_LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    #mem_limit: ${APP_MEM_LIMIT:-256m}
    #cpus: ${APP_CPU_LIMIT:-0.5}
    #pids_limit: ${APP_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Test runner: same image, tests mounted in. Behind a profile so it
  # never starts with `docker compose up`. The mount lives here rather
  # than in a `-v` flag so the path survives shells that rewrite
  # absolute paths (Git Bash on Windows).
  tests:
    profiles: [test]
    build:
      context: .
      target: runtime
    image: pasapalabra:dev
    environment:
      # The image ships as a non-root user over a root-owned /srv, so
      # anything that compiles bytecode needs a writable cache dir.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - ./tests:/srv/tests:ro
    command: ["python", "-m", "unittest", "discover", "-s", "tests/unit", "-t", ".", "-v"]

  # Question generator. Separate image (Dockerfile `tools` stage): it is
  # the only thing here that carries the Anthropic SDK, needs an API key
  # and reaches the network, and it writes into the question bank. The
  # deployed app has none of that — see docs/decisions/0008-*.md.
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    image: pasapalabra:tools
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - ./app/data:/srv/app/data
      - ./scripts:/srv/scripts:ro
